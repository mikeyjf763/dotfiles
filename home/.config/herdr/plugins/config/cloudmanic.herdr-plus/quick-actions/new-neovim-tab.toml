name = "New Neovim Review Tab"
description = "Open Neovim in a new tab for this directory"
type = "command"
command = '''
herdr_bin="${HERDR_BIN_PATH:-herdr}"
created="$("$herdr_bin" tab create --cwd "$PWD" --label "Neovim" --focus)"
pane_id="$(printf '%s' "$created" | jq -er '.result.root_pane.pane_id')"
"$herdr_bin" pane run "$pane_id" nvim .
'''
